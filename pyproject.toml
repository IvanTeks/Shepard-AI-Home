[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shepard-labyrinth"
version = "0.1.0"
description = "A local-first, multi-agent AI ecosystem powered by Ollama"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
shepard = "shepard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["shepard*"]
